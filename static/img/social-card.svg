<svg width="1080" height="320" viewBox="0 0 1080 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Combined header banner with titles">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="codexGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>

  <!-- Skyledger block -->
  <g transform="translate(0,0)">
    <rect x="0" y="0" width="360" height="320" rx="24" fill="url(#skyGrad)"/>
    <!-- emblem -->
    <g transform="translate(92,60)">
      <rect x="0" y="0" width="176" height="176" rx="12" fill="rgba(255,255,255,0.15)"/>
      <g stroke="rgba(255,255,255,0.4)" stroke-width="2">
        <path d="M44 0 V176"/>
        <path d="M88 0 V176"/>
        <path d="M132 0 V176"/>
        <path d="M0 44 H176"/>
        <path d="M0 88 H176"/>
        <path d="M0 132 H176"/>
      </g>
      <g transform="translate(108,20)" fill="#ffffff">
        <circle cx="26" cy="18" r="18"/>
        <circle cx="46" cy="24" r="14"/>
        <circle cx="14" cy="26" r="14"/>
        <rect x="12" y="26" width="48" height="16" rx="8" ry="8"/>
      </g>
    </g>
    <text x="180" y="300" text-anchor="middle" font-family="Segoe UI, Inter, Arial" font-size="28" font-weight="700" fill="#ffffff">Skyledger</text>
  </g>

  <!-- Personal OS block -->
  <g transform="translate(360,0)">
    <rect x="0" y="0" width="360" height="320" rx="24" fill="url(#amberGrad)"/>
    <!-- emblem -->
    <g transform="translate(92,60)">
      <circle cx="88" cy="88" r="70" fill="rgba(255,255,255,0.2)" stroke="#fff" stroke-width="4"/>
      <polygon points="88,28 112,88 88,148 64,88" fill="#fff"/>
      <path d="M48 148 L72 168 L128 108" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="180" y="300" text-anchor="middle" font-family="Segoe UI, Inter, Arial" font-size="28" font-weight="700" fill="#ffffff">My Personal OS</text>
  </g>

  <!-- Work Codex block -->
  <g transform="translate(720,0)">
    <rect x="0" y="0" width="360" height="320" rx="24" fill="url(#codexGrad)"/>
    <!-- emblem -->
    <g transform="translate(92,60)">
      <path d="M20 44 Q88 20 156 44 L156 140 Q88 164 20 140 Z" fill="#fff" opacity="0.95"/>
      <path d="M88 40 L88 144" stroke="#4f46e5" stroke-width="4" opacity="0.35"/>
      <path d="M112 44 L132 44 L132 120 L122 112 L112 120 Z" fill="#4f46e5" opacity="0.85"/>
      <g fill="#4f46e5" opacity="0.6">
        <circle cx="44" cy="72" r="4"/>
        <rect x="54" y="68" width="28" height="8"/>
        <circle cx="44" cy="96" r="4"/>
        <rect x="54" y="92" width="40" height="8"/>
        <circle cx="44" cy="120" r="4"/>
        <rect x="54" y="116" width="36" height="8"/>
      </g>
    </g>
    <text x="180" y="300" text-anchor="middle" font-family="Segoe UI, Inter, Arial" font-size="28" font-weight="700" fill="#ffffff">Work Codex</text>
  </g>
</svg>