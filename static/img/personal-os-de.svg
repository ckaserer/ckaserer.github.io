<!-- My Personal OS: primary -->
<svg width="720" height="240" viewBox="0 0 720 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="My Personal OS logo">
  <defs>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <!-- emblem -->
  <g transform="translate(32,32)">
    <rect x="0" y="0" rx="20" ry="20" width="176" height="176" fill="url(#amberGrad)"/>
    <rect x="0" y="0" width="176" height="28" rx="20" ry="20" fill="rgba(255,255,255,0.25)"/>
    <circle cx="16" cy="14" r="4" fill="#ffffff"/>
    <circle cx="32" cy="14" r="4" fill="#ffffff" opacity="0.8"/>
    <circle cx="48" cy="14" r="4" fill="#ffffff" opacity="0.6"/>
    <g transform="translate(28,44)">
      <circle cx="60" cy="60" r="50" fill="rgba(255,255,255,0.2)" stroke="#ffffff" stroke-width="3"/>
      <polygon points="60,16 80,60 60,104 40,60" fill="#ffffff"/>
      <path d="M18 108 L44 128 L92 84" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <!-- wordmark -->
  <g transform="translate(236,86)">
    <text x="0" y="60" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="60" font-weight="800" fill="#0f172a">Personal OS</text>
    <text x="2" y="104" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#334155">Systeme für bewusstes, entrümpeltes Leben</text>
  </g>
</svg>