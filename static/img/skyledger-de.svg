<!-- Skyledger: primary -->
<svg width="720" height="240" viewBox="0 0 720 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Skyledger logo">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <!-- emblem -->
  <g transform="translate(32,32)">
    <rect x="0" y="0" rx="12" ry="12" width="176" height="176" fill="url(#skyGrad)"/>
    <!-- grid lines -->
    <g stroke="rgba(255,255,255,0.55)" stroke-width="2">
      <path d="M44 0 V176"/>
      <path d="M88 0 V176"/>
      <path d="M132 0 V176"/>
      <path d="M0 44 H176"/>
      <path d="M0 88 H176"/>
      <path d="M0 132 H176"/>
    </g>
    <!-- cloud -->
    <g transform="translate(108,20)" fill="#ffffff">
      <circle cx="26" cy="18" r="18"/>
      <circle cx="46" cy="24" r="14"/>
      <circle cx="14" cy="26" r="14"/>
      <rect x="12" y="26" width="48" height="16" rx="8" ry="8"/>
    </g>
  </g>
  <!-- wordmark -->
  <g transform="translate(236,86)">
    <text x="0" y="64" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="64" font-weight="700" fill="#0f172a">Sky Ledger</text>
    <text x="2" y="104" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#334155">Cloud Foundation &amp; Infrastruktur für den EWR</text>
  </g>
</svg>