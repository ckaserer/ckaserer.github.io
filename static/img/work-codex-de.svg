<!-- Work Codex: primary -->
<svg width="720" height="240" viewBox="0 0 720 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Work Codex logo">
  <defs>
    <linearGradient id="codexGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>
  <!-- emblem -->
  <g transform="translate(32,32)">
    <rect x="0" y="0" rx="12" ry="12" width="176" height="176" fill="url(#codexGrad)"/>
    <path d="M20 44 Q88 20 156 44 L156 140 Q88 164 20 140 Z" fill="#ffffff" opacity="0.95"/>
    <path d="M88 40 L88 144" stroke="#4f46e5" stroke-width="4" opacity="0.35"/>
    <path d="M112 44 L132 44 L132 120 L122 112 L112 120 Z" fill="#4f46e5" opacity="0.85"/>
    <g fill="#4f46e5" opacity="0.6">
      <circle cx="44" cy="72" r="4"/>
      <rect x="54" y="68" width="28" height="8"/>
      <circle cx="44" cy="96" r="4"/>
      <rect x="54" y="92" width="40" height="8"/>
      <circle cx="44" cy="120" r="4"/>
      <rect x="54" y="116" width="36" height="8"/>
    </g>
  </g>
  <!-- wordmark -->
  <g transform="translate(236,86)">
    <text x="0" y="64" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="64" font-weight="800" fill="#0f172a">Work Codex</text>
    <text x="2" y="104" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#334155">Systeme und Prinzipien für fokussiertes, zielgerichtetes Arbeiten</text>
  </g>
</svg>
