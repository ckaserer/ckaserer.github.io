<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 256 256">
  <defs>
    <mask id="cmask">
      <rect width="256" height="256" fill="white"/>
      <rect x="148" y="0" width="128" height="256" fill="black"/>
    </mask>
  </defs>
  <!-- Background -->
  <rect width="256" height="256" rx="48" fill="#4a83ff"/>
  <!-- CK Monogram -->
  <g stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- C (almost-circle with open gap) -->
    <g mask="url(#cmask)">
      <circle cx="128" cy="128" r="80"/>
    </g>
    <!-- K -->
    <path d="M128 128 L200 78"/>
    <path d="M128 128 L200 178"/>
  </g>
</svg>